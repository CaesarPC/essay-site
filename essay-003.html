<span class="tag">写景</span>
<p>春天来了，花儿开了，草绿了，小鸟在树上唱歌。公园里到处是五颜六色的花朵，有红的、黄的、紫的。春风吹在脸上暖洋洋的，真舒服啊。春天真美丽！</p>
