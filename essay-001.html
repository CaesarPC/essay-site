<h1>我的妈妈</h1>
<span class="tag">写人</span>
<p>我的妈妈是一个普通的家庭主妇，但在我心里她是最伟大的人。她每天早起为我做早餐，送我上学，晚上还要辅导我功课。妈妈总是把最好的留给我，自己却舍不得花钱。我想对妈妈说：妈妈，我爱你，长大了我一定要好好孝顺你。</p>
