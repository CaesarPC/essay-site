<h1>难忘的一次旅行</h1>
<span class="tag">记事</span>
<p>暑假里，爸爸妈妈带我去了海边。我第一次看到大海，蓝色的大海一望无际。我们在沙滩上堆城堡、捡贝壳，还在海里游泳。海浪一波接一波冲过来，真刺激。那天我玩得很开心，这是我最难忘的一次旅行。</p>
