<span class="tag">写景</span>
<p>我的家乡在一个小山村，那里有山有水，风景优美。春天满山遍野都是野花，夏天河里可以游泳，秋天果子熟了，冬天白茫茫一片。我爱我的家乡，欢迎大家来玩。</p>
