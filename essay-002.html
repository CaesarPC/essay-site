<h1>难忘的一天</h1>
<span class="tag">记事</span>
<p>那是一个星期天，我和爸爸妈妈去公园玩。我们划了船，喂了鸽子，还吃了冰淇淋。最开心的是和爸爸一起放风筝，风筝飞得很高很高。那天我真的很开心，这是我最难忘的一天。</p>
