<span class="tag">记事</span>
<p>上周我过了生日，爸爸妈妈给我买了蛋糕，还请了我的好朋友。我们一起唱生日歌、吃蛋糕、玩游戏。我收到了很多礼物，真开心。这是我最难忘的一个生日。</p>
