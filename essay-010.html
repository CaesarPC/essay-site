<span class="tag">记事</span>
<p>今天我学会了做西红柿炒蛋。先把西红柿洗净切块，再打两个鸡蛋搅匀。然后热锅倒油，先炒鸡蛋盛出来，再炒西红柿，最后倒回鸡蛋一起炒。妈妈夸我做得好吃，我真开心。</p>
