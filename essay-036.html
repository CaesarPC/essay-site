<h1>美丽的秋天</h1>
<span class="tag">写景</span>
<p>秋天来了，树叶黄了，果子熟了。田野里一片金黄，农民伯伯忙着收割。秋风一吹，落叶像蝴蝶一样飞舞。秋天是收获的季节，到处都是喜洋洋的。我爱秋天。</p>
