<span class="tag">记事</span>
<p>今天我学会了洗碗。吃完饭，我把碗收到厨房，打开水龙头，用洗洁精一个一个洗。妈妈说我洗得干净，还夸我长大了。我真开心，以后我要经常帮妈妈做家务。</p>
